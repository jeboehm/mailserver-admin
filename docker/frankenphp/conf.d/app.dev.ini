; Loaded after php.ini-development.

memory_limit = 512M
date.timezone = UTC
expose_php = Off

; Code changes take effect without a restart.
opcache.enable = 0
opcache.enable_cli = 0

; Off unless XDEBUG_MODE is set, e.g. `docker compose exec -e XDEBUG_MODE=debug php …`.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
