name: Application tests
on:
  pull_request:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  PHP_EXTENSIONS: mbstring, xml, ctype, iconv, intl, mysql, pgsql, pdo_pgsql
  # Lets the kernel boot in build and static-analysis; those jobs never connect.
  # The phpunit job overrides this per matrix leg.
  DATABASE_URL: mysql://root:symfony@127.0.0.1:3306/symfony
  REDIS_HOST: localhost
  APP_ENV: test
jobs:
  build:
    name: Build dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: xdebug
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            assets/vendor/
          key: ${{ runner.os }}-cache-${{ hashFiles('**/composer.lock') }}-${{ hashFiles('**/importmap.php') }}
          restore-keys: |
            ${{ runner.os }}-cache-
      - name: Prepare build artifact
        run: |
          composer install --no-progress -a
          composer run create-tls
          bin/console asset-map:compile
      - name: Create build artifacts archive
        run: |
          tar -czf build-artifacts.tar.gz assets/vendor/ tls/ var/ vendor/
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: build-artifacts.tar.gz
          retention-days: 1
  static-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts
          path: .
      - name: Extract build artifacts
        run: tar -xzf build-artifacts.tar.gz
      - name: Cleanup archive
        run: rm build-artifacts.tar.gz
      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --diff
      - name: rector
        run: vendor/bin/rector process src/ --dry-run
      - name: PHPStan
        run: composer run phpstan
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-versions }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:lts@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: symfony
          MYSQL_DATABASE: symfony
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: symfony
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U symfony" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        php-versions:
          - "8.4"
          - "8.5"
        database:
          - mysql
          - postgres
        # Both service containers always run; this picks the one under test.
        include:
          - database: mysql
            database-url: "mysql://root:symfony@127.0.0.1:3306/symfony?serverVersion=8.4"
          - database: postgres
            database-url: "postgresql://symfony:symfony@127.0.0.1:5432/symfony?serverVersion=18&charset=utf8"
    env:
      DATABASE_URL: ${{ matrix.database-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: xdebug
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts
          path: .
      - name: Extract build artifacts
        run: tar -xzf build-artifacts.tar.gz
      - name: Cleanup archive
        run: rm build-artifacts.tar.gz
      # Mirrors the bootstrap docker-mailserver runs on container start.
      - name: Check connections against an empty database
        run: bin/console system:check --wait --allow-empty-database
      - name: Migrate from an empty database
        run: bin/console doctrine:migrations:migrate -n
      - name: Migrating again must be a no-op
        run: bin/console doctrine:migrations:migrate -n
      # schema:validate reports doctrine's own migration_versions table as
      # drift; migrations:diff excludes it, so it is the usable gate here.
      # The pipe masks the exit code on purpose, grep is the gate.
      - name: Schema must match the mapping
        run: |
          bin/console doctrine:migrations:diff 2>&1 | tee diff.log
          grep -q 'No changes detected' diff.log
      - name: Seed the migrated schema
        run: |
          bin/console domain:add example.com
          bin/console user:add --password=changeme --admin --enable admin example.com
          bin/console dkim:setup --enable --selector dkim example.com
      - name: Migrated schema must be usable
        run: bin/console system:check
      - name: Run tests
        run: php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-cobertura=coverage.xml
      - name: Create code coverage report
        if: ${{ matrix.php-versions == '8.4' && matrix.database == 'mysql' }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        if: ${{ matrix.php-versions == '8.4' && matrix.database == 'mysql' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          recreate: true
          path: code-coverage-results.md
