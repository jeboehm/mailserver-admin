monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mcp_audit # One record per MCP tool call, see App\Mcp\Audit\ToolAuditLog

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!mcp_audit"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            mcp_audit:
                type: service
                id: app.test.mcp_audit_records
                channels: ["mcp_audit"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mcp_audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Outside fingers_crossed, which would only write the record of a request that failed.
            mcp_audit:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: ["mcp_audit"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!mcp_audit"]
